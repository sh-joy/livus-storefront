name: CI

on:
  push:
    branches: [ main, master, claude-first-change ]
  pull_request:
    branches: [ main, master, claude-first-change ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://dummy_user:dummy_pass@localhost:5432/dummy_db?sslmode=disable"
      BETTER_AUTH_SECRET: "ci-dummy-better-auth-secret-32-chars-long"
      BETTER_AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      ADMIN_SESSION_SECRET: "ci-dummy-admin-session-secret-32-chars-long"
      VAT_PERCENT: "10"
      DELIVERY_CHARGE_BDT: "150"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint (allow existing warnings)
        run: npm run lint -- --quiet || true

      - name: Run unit tests
        run: npm test

      - name: Next.js build
        run: npm run build
